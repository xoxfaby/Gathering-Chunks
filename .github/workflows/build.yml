name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload artifact
        uses: actions/upload-artifacts@v6
        with:
         name: ${{ github.event.repository.name }}-NeoForge
         path: ./NeoForge/build/libs/GatheringChunks-*.jar
      - name: Upload artifact
        uses: actions/upload-artifacts@v6
        with:
         name: ${{ github.event.repository.name }}-Fabric
         path: ./Fabric/build/libs/GatheringChunks-*.jar